<style>
#tabs { margin-block: 16px; }
#panel .card { margin-bottom: 12px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--purple-soft); }
.rowform { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rowform input, .rowform select { flex: 1 1 125px; }
.rowform input[type="hidden"] { display: none; }
#panel .btn:not(.primary) { background: var(--purple-soft); color: var(--text); box-shadow: none; }
.crm-heading { margin-bottom: 14px; }
.crm-facts { display: flex; gap: 12px 26px; flex-wrap: wrap; margin: 14px 0; }
.crm-facts > div, .crm-form > div { min-width: 0; }
.crm-facts dt { color: var(--muted); font-size: .8rem; }
.crm-facts dd { margin: 0; }
.crm-form { align-items: flex-end; }
.crm-form > div { display: grid; flex: 1 1 180px; gap: 4px; font-size: .875rem; }
.crm-form select { width: 100%; }
.crm-pages { display: flex; gap: 8px; }
.err { color: #b42318; }
</style>
<meta name="theme-color" content="#dfd3f8">
