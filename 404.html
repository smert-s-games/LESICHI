<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Страница не найдена — Lesichi</title>
<link rel="icon" id="favicon" href="image/site/icon2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css" id="site-theme">
<script>
  if (location.protocol !== "file:") {
    const root = location.pathname.startsWith("/LESICHI/") ? "/LESICHI/" : "/";
    document.getElementById("site-theme").href = root + "css/site.css";
    document.getElementById("favicon").href = root + "image/site/icon2.png";
  }
</script>
<style>
.error-main { display: grid; align-items: center; }
.error-hero { margin-bottom: 0; }
.error-hero .btn { margin-top: 22px; }
.error-hero .page-hero-art { width: clamp(150px, 32vw, 320px); }
.error-code { color: var(--purple); font-size: clamp(2rem, 7vw, 6rem); font-weight: 900; line-height: 1; }
@media (max-width: 640px) {
  .error-hero { flex-direction: column-reverse; text-align: center; }
}
</style>
<meta name="theme-color" content="#dfd3f8">
</head>
<body class="content-page">
<a class="skip-link" href="#main">К содержимому</a>
<main id="main" tabindex="-1" class="container page-main error-main">
  <div class="page-hero error-hero">
    <div>
      <p class="error-code">404</p>
      <h1 class="page-title">Лесик свернул не туда</h1>
      <p class="page-sub">Такой страницы нет. Вернись на главную — созвоны на месте.</p>
      <a class="btn" data-site-path="index.html" href="index.html">На главную</a>
    </div>
    <img class="page-hero-art" width="1100" height="1042" data-site-path="image/site/hero-fox-print.webp" alt="">
  </div>
</main>
<script>
  const root = location.protocol === "file:" ? "" : (location.pathname.startsWith("/LESICHI/") ? "/LESICHI/" : "/");
  document.querySelectorAll("[data-site-path]").forEach(function (element) {
    element.setAttribute(element.tagName === "IMG" ? "src" : "href", root + element.dataset.sitePath);
  });
</script>
</body>
</html>
